# EXAMPLE ONLY. Put filled-in values in Streamlit Cloud Settings > Secrets.
# Never put real secrets in GitHub or in this example file.
[auth]
redirect_uri = "https://YOUR-APP.streamlit.app/oauth2callback"
cookie_secret = "REPLACE_WITH_A_LONG_RANDOM_SECRET"
client_id = "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
client_secret = "YOUR_GOOGLE_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[accounts]
# Copy the Session pooler URI from Supabase > Connect. Keep its exact hostname
# and username. Replace the password placeholder with your encoded DB password.
database_url = "postgresql://postgres.PROJECT_REF:ENCODED_PASSWORD@POOLER_HOST:5432/postgres"
