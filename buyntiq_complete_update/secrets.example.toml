# EXAMPLE ONLY: edit values in Streamlit Cloud > Settings > Secrets.
# Keep real secret keys and database passwords out of GitHub.

[accounts]
# Keep your existing working private database URL.
database_url = "postgresql://postgres.PROJECT_REF:ENCODED_PASSWORD@POOLER_HOST:5432/postgres"

[supabase]
url = "https://YOUR_PROJECT_REF.supabase.co"
publishable_key = "YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY"

[stripe]
# Live billing: keep the real secret only in Streamlit Secrets, never in GitHub.
secret_key = "YOUR_STRIPE_LIVE_SECRET_KEY"
# Use the LIVE recurring Price IDs from the same Stripe account/mode.
price_id = "YOUR_STRIPE_LIVE_MONTHLY_PRICE_ID"
annual_price_id = "YOUR_STRIPE_LIVE_ANNUAL_PRICE_ID"
site_url = "https://buyntiq.streamlit.app"
# Keep previous subscription prices authorized after a future price change:
# additional_pro_price_ids = ["price_OLD"]

[plans]
# Optional: copy your identifier from Plans > Account identifier after signing in.
owner_account_keys = []
free_research_per_day = 5

# Existing Google login can remain. It is optional for email-code login.
# If already configured in Streamlit, preserve its existing values.
# [auth]
# redirect_uri = "https://buyntiq.streamlit.app/oauth2callback"
# cookie_secret = "YOUR_LONG_RANDOM_COOKIE_SECRET"
# client_id = "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
# client_secret = "YOUR_GOOGLE_CLIENT_SECRET"
# server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

Pro bypasses daily usage reservations entirely, including for owner accounts. Legacy `pro_*_per_day` settings are ignored. Provider throttling and hosting capacity can still affect availability.
